# Alley 셀프호스팅 구성.
#
# `cp .env.example .env` 로 설정을 만든 뒤 `docker compose up` 하면
# 서버 + PostgreSQL + S3 호환 스토리지가 한 번에 뜹니다.
#
# 이 구성은 특정 클라우드나 조직 인프라를 전제하지 않습니다.
# 어디에 배포하든 서버는 아래 환경변수만 알면 됩니다.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 컨테이너 사이 통신은 서비스 이름으로 한다.
      DATABASE_URL: postgres://${POSTGRES_USER:-alley}:${POSTGRES_PASSWORD:-alley}@postgres:5432/${POSTGRES_DB:-alley}
      S3_ENDPOINT: http://minio:9000
      S3_USE_PATH_STYLE: "true"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alley}
      POSTGRES_DB: ${POSTGRES_DB:-alley}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때 한 번만 돈다. 테스트용 데이터베이스를 만든다.
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 서버를 `swift run` 으로 띄워 개발할 때 호스트에서 붙기 위한 것이다.
      # 루프백에만 바인딩해 외부에 노출하지 않는다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # 서버가 붙기 전에 DB가 실제로 질의를 받을 수 있는지 확인한다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alley} -d ${POSTGRES_DB:-alley}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # 버전을 고정한다. latest 는 언제 받느냐에 따라 다른 판이 뜬다.
    # 오픈소스로 공개하는 레포라 "받아서 그대로 뜨는지"가 중요하고,
    # 누가 못 띄우겠다고 했을 때 같은 것을 보고 있어야 재현할 수 있다.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-alleyminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-minio-secret}
      # 브라우저가 여기로 직접 올리므로(ADR-0009) 그 출처만 허용한다.
      # 기본값이 PUBLIC_BASE_URL 을 따라가서, 주소만 바꿔도 업로드가 계속 된다.
      # 콘솔과 다른 출처를 더 허용해야 하면 MINIO_CORS_ALLOW_ORIGIN 에
      # 쉼표로 구분해 직접 적는다. 경로 없는 scheme://host:port 형태여야 한다.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-${PUBLIC_BASE_URL:-http://localhost:8080}}
    volumes:
      - minio-data:/data
    ports:
      # API 와 콘솔 모두 루프백에만 연다. API 포트는 호스트에서 개발할 때 쓴다.
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 버킷을 한 번 만들고 끝나는 일회성 작업.
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-alley-artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-alleyminio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo '버킷 준비 완료: '$$S3_BUCKET
      "

volumes:
  postgres-data:
  minio-data:
