# 로컬 개발용 덮어쓰기. compose 가 docker-compose.yml 과 함께 자동으로 읽습니다.
#
# 레포를 클론한 사람은 이 파일이 있으므로 소스에서 서버를 짓습니다.
# 서버에 배포하는 사람은 docker-compose.yml 과 .env 만 가져가므로 이 파일이 없고,
# 그래서 발행된 이미지를 그대로 받습니다 (ADR-0021).
#
# 클론한 상태에서 발행된 이미지로 띄워보려면 이 파일을 빼고 부릅니다:
#   docker compose -f docker-compose.yml up -d

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile

  postgres:
    volumes:
      # 볼륨이 비어 있을 때 한 번만 돈다. 테스트용 데이터베이스를 만든다.
      # 레포가 있어야 읽을 수 있고 테스트에만 쓰이므로 여기에 둔다.
      # 기본 파일에 두면 소스 없이 띄운 서버가 빈 디렉터리를 만들어 물린다.
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
