# 고정한 제품 버전 (ADR-0043).
#
# 이 값 하나를 올리면 워커·스토어 앱·서버가 전부 따라갑니다.
# `watch.yml` 이 제품 레포에 새 릴리스가 뜨면 이 파일을 올리는 PR 을 만듭니다.
#
# 서브모듈 `product/` 도 같은 태그를 가리켜야 합니다. `adopt.yml` 이 대조합니다.
#
# **태그 이름을 그대로 적습니다. `v` 를 뗀 값이 아닙니다.**
# 대조는 이 값과 `git describe --tags` 결과를 문자열로 비교합니다.
#
#   alley=v0.3.0     (맞음)
#   alley=0.3.0      (틀림 — "0.3.0 인데 서브모듈은 v0.3.0" 으로 멈춥니다)
alley=v0.3.0
