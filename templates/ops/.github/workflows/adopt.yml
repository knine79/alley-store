name: 제품 반영

# 고정한 제품 버전을 빌드·서명해 스토어에 올린다 (ADR-0043).
#
# **서명 맥에서 돈다.** Developer ID 개인키가 그 맥의 로그인 키체인에 있고, 그것을
# 밖으로 내보내지 않으려고 self-hosted 러너를 쓴다.
#
# 올리고 나면 나머지는 저절로 퍼진다.
#   - 워커는 일이 없을 때 스스로 갈아끼운다 (제품 ADR-0042)
#   - 스토어 앱은 스토어에 올라온 자기 새 버전을 자기 설치 코드로 갈아끼운다.
#     **Sparkle 이 아니다.** 스토어 앱에는 Sparkle 이 들어 있지 않아서 Sparkle
#     서명키도 필요 없다 (제품 `docs/design.md` 5.5)
#
# 각 맥에 갈 일이 없다.
on:
  push:
    branches: [main]
    paths:
      - 'alley.lock'
      - 'product'
      - 'config/**'
      - '.github/workflows/adopt.yml'
  workflow_dispatch:
    inputs:
      skip_worker:
        description: '워커 릴리스 올리기를 건너뛴다'
        type: boolean
        default: false
      skip_store_app:
        description: '스토어 앱 빌드를 건너뛴다'
        type: boolean
        default: false

# 두 번이 겹치면 같은 버전을 두 번 올려 409 가 난다. 앞의 것을 끝까지 두고 기다린다.
concurrency:
  group: alley-adopt
  cancel-in-progress: false

jobs:
  adopt:
    name: 빌드·서명·업로드
    # 이 라벨이 붙은 러너에서만 돈다. 서명 맥 하나다.
    runs-on: [self-hosted, macos, alley-signing]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # alley.lock 과 서브모듈이 같은 곳을 가리키는지 본다.
      #
      # 서브모듈 포인터만 옮기고 lock 을 안 고치는 실수가 흔하다. 그러면 "v0.3.0 을
      # 깔았다" 고 기록에 남는데 실제로는 다른 커밋이 깔린다. 조용한 어긋남이다.
      - name: 고정 버전 대조
        id: lock
        run: |
          set -euo pipefail
          TAG=$(sed -n 's/^alley=//p' alley.lock | head -1)
          [ -n "$TAG" ] || { echo "alley.lock 에서 버전을 읽지 못했습니다." >&2; exit 1; }

          SUB=$(git -C product describe --tags --exact-match 2>/dev/null || echo "")
          if [ "$SUB" != "$TAG" ]; then
            echo "alley.lock 은 $TAG 인데 서브모듈은 ${SUB:-태그 없는 커밋} 입니다." >&2
            echo "  git -C product fetch --tags && git -C product checkout $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # `v` 를 뗀 값도 함께 내놓는다. 표현식 안에서는 bash 확장을 쓸 수 없다.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "$TAG"

      - name: 설정 읽기
        run: |
          set -euo pipefail
          # 값에 공백이 있어 `export $(cat …)` 은 쓸 수 없다. 한 줄씩 넣는다.
          #
          # 따옴표는 여기서 벗긴다. 그 파일들은 셸에서 `source` 할 수 있게 값을
          # 따옴표로 감싸 두는데, `$GITHUB_ENV` 는 셸이 아니라 `KEY=VALUE` 를 글자
          # 그대로 읽는다. 그대로 넣으면 따옴표가 값의 일부가 되고, 그때 나오는
          # 오류는 원인을 짐작하기 어렵다.
          #
          #   Error: Profile name contains invalid characters: ["Quotation Mark", …]
          for file in config/signing.env config/store.env; do
            while IFS= read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              line="${line%$'\r'}"
              key="${line%%=*}"
              value="${line#*=}"
              case "$value" in
                '"'*'"') value="${value#\"}"; value="${value%\"}" ;;
                "'"*"'") value="${value#\'}"; value="${value%\'}" ;;
              esac
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            done < "$file"
          done

      # 키체인이 잠겨 있으면 서명이 조용히 실패한다. 여기서 먼저 막는다.
      #
      # 그 맥은 사람이 잘 가지 않는 머신이라, 재부팅 뒤 아무도 로그인하지 않으면
      # 이 상태가 된다. 자동 로그인을 켜두는 것이 전제다.
      - name: 서명 환경 점검
        run: |
          set -euo pipefail
          # 리터럴이 아니라 설정값으로 찾는다. 리터럴로 보면 `ALLEY_SIGNING_IDENTITY`
          # 가 잘못돼 있어도 이 줄은 통과하고, 한참 뒤 서명 단계에서 드러난다.
          security find-identity -v -p codesigning | grep -qF "$ALLEY_SIGNING_IDENTITY" \
            || { echo "키체인에서 '$ALLEY_SIGNING_IDENTITY' 를 찾지 못했습니다. 없거나 키체인이 잠겨 있습니다." >&2; exit 1; }
          xcrun notarytool history --keychain-profile "$ALLEY_NOTARY_PROFILE" \
            --output-format json >/dev/null \
            || { echo "공증 자격증명을 쓸 수 없습니다. 키체인이 잠겼을 수 있습니다." >&2; exit 1; }

      # ── 워커 ────────────────────────────────────────────
      #
      # 워커 버전이 이미 올라가 있으면 건너뛴다. 파이프라인이 재실행될 때마다
      # 409 로 죽으면 "이미 됐다" 와 "실패" 를 구분할 수 없다.
      - name: 워커 버전 확인
        if: ${{ !inputs.skip_worker }}
        id: worker
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' \
              product/Sources/AlleyShared/WorkerVersion.swift | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          EXISTING=$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.ALLEY_OPERATOR_TOKEN }}" \
              "${{ secrets.ALLEY_SERVER_URL }}/api/v1/ops/worker-releases" \
            | python3 -c 'import json,sys; print(" ".join(r["version"] for r in json.load(sys.stdin)))')

          if printf '%s\n' $EXISTING | grep -qx "$VERSION"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "워커 $VERSION 은 이미 올라가 있습니다."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "워커 $VERSION 을 올립니다."
          fi

      - name: 워커 빌드·서명
        if: ${{ !inputs.skip_worker && steps.worker.outputs.needed == 'true' }}
        working-directory: product
        run: ./scripts/build-worker-app.sh --sign

      - name: 워커 릴리스 업로드
        if: ${{ !inputs.skip_worker && steps.worker.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.ALLEY_OPERATOR_TOKEN }}" \
            -F "version=${{ steps.worker.outputs.version }}" \
            -F "bundle=@product/.build/worker-app/alley-worker.zip" \
            "${{ secrets.ALLEY_SERVER_URL }}/api/v1/ops/worker-releases"
          echo
          echo "워커들이 일이 없을 때 스스로 갈아끼웁니다."

      # ── 스토어 앱 ───────────────────────────────────────
      #
      # 여기서 서명하지 않는다. 브랜딩 없는 베이스 번들만 만들어 올리면, 서버가
      # 조직의 이름·번들 ID·아이콘을 입히고 서명 워커가 서명한다 (제품 ADR-0046).
      #
      # 배포 토큰을 쓰지 않는다. 앱 하나에 묶이는 토큰인데(ADR-0015) 이 일은 앱에
      # 올리는 것이 아니라 스토어 자신을 갱신하는 것이라, 워커 릴리스와 같은 운영
      # 토큰을 쓴다.
      - name: 스토어 앱 상태 확인
        if: ${{ !inputs.skip_store_app }}
        id: store_app
        run: |
          set -euo pipefail
          BUILT=$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.ALLEY_OPERATOR_TOKEN }}" \
              "${{ secrets.ALLEY_SERVER_URL }}/api/v1/ops/store-app" \
            | python3 -c 'import json,sys; print("\n".join(b["shortVersion"] for b in json.load(sys.stdin)["builds"]))')

          # 이 버전으로 이미 빌드했으면 다시 하지 않는다. 빌드 번호는 서버가 스스로
          # 올리므로 두 번 돌리면 버전이 하나 더 생긴다. 워커 릴리스처럼 서버가
          # 같은 버전을 거절해주지 않는다.
          # 따옴표를 붙인다. 셸의 단어 분리에 기대면 zsh 처럼 분리하지 않는 셸에서
          # 조용히 "없다" 로 떨어지고, 그러면 같은 버전을 두 번 빌드한다.
          if printf '%s\n' "$BUILT" | grep -qx "${{ steps.lock.outputs.version }}"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "스토어 앱 ${{ steps.lock.outputs.version }} 은 이미 빌드돼 있습니다."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "스토어 앱 ${{ steps.lock.outputs.version }} 을 빌드합니다."
          fi

      - name: 스토어 앱 베이스 번들 만들기
        if: ${{ !inputs.skip_store_app && steps.store_app.outputs.needed == 'true' }}
        working-directory: product
        env:
          # 브랜딩 없는 재료라 주소를 박지 않는다. 조직마다 다르고, 서버가 조립할
          # 때 자기 `PUBLIC_BASE_URL` 로 채운다 (ADR-0046). 이 표시가 없으면
          # 스크립트가 "주소가 없다" 며 거절한다. 그 거절이 기본값인 이유는,
          # 주소 없이 나간 앱은 받은 사람에게 주소를 묻게 되고 그러면 서명한
          # 조직이 보증하지 않은 서버에도 붙기 때문이다.
          ALLEY_STORE_APP_BASE_BUNDLE: '1'
        run: ./scripts/build-store-app.sh

      - name: 베이스 번들 올리고 빌드시키기
        if: ${{ !inputs.skip_store_app && steps.store_app.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.ALLEY_OPERATOR_TOKEN }}" \
            -F "version=${{ steps.lock.outputs.version }}" \
            -F "bundle=@product/.build/store-app/alley-store-app-unsigned.zip" \
            "${{ secrets.ALLEY_SERVER_URL }}/api/v1/ops/store-app/base-bundle" > /dev/null

          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.ALLEY_OPERATOR_TOKEN }}" \
            "${{ secrets.ALLEY_SERVER_URL }}/api/v1/ops/store-app/build" > /dev/null
          echo
          echo "서명 대기열에 넣었습니다. 서명·공증이 끝나면 관리 > 스토어 앱에서 출시하세요."

      - name: CLI 빌드·서명
        working-directory: product
        run: ./scripts/build-cli.sh --sign

      # ── 서버 ────────────────────────────────────────────
      #
      # 서버는 서명이 필요 없어 제품 레포 CI 가 이미 이미지를 올려뒀다. 여기서는
      # 그것을 실제 환경에 굴리기만 한다. 배포 플랫폼마다 달라서 스크립트로 뺀다.
      #
      # **스크립트가 쓰는 값은 여기서 넘겨야 합니다.** 그 스크립트는 조직이 쓰는
      # 것이라 이 워크플로는 무엇이 필요한지 모른다. 레지스트리 자격증명처럼 흔한
      # 것만 미리 자리를 내준다. 더 필요하면 이 `env:` 에 줄을 더하세요. 빠뜨리면
      # `set -u` 를 쓴 스크립트가 `unbound variable` 로 죽는다.
      #
      # 시크릿이 없으면 빈 문자열이 들어간다. 그러면 "값이 없다" 를 스크립트가
      # 자기 말로 알릴 수 있다. 변수 자체가 없어서 나는 오류보다 읽기 낫다.
      #
      # 이 단계는 잡의 마지막입니다. 여기서만 실패하면 빌드·서명·공증·업로드는
      # 이미 끝난 것이라, 이미지를 손으로 굴리면 그 릴리스는 그대로 유효합니다.
      # 제품 CI 가 이미지를 다 올렸는지 먼저 본다.
      #
      # **릴리스와 이미지는 따로 끝납니다.** 태그를 밀면 릴리스 워크플로와 이미지
      # 빌드가 같이 시작하는데, 릴리스는 1분대에 끝나고 이미지는 몇 분 더 걸립니다.
      # 하루에 한 번 도는 감시가 PR 을 열 때는 그 사이가 이미 지나 있어서 문제가
      # 없지만, 릴리스 직후에 손으로 감시를 돌려 바로 머지하면 여기가 먼저 도착해
      # `not found` 로 떨어집니다. 실제로 그렇게 두 번 걸렸습니다.
      #
      # 기다리는 편이 맞습니다. 여기서 실패하면 빌드·서명·공증·업로드는 이미 끝난
      # 뒤라, 사람이 로그를 보고 "이미지가 없다" 를 이해한 다음 이 단계만 다시
      # 돌려야 합니다. 그 왕복을 없앱니다.
      - name: 서버 이미지 기다리기
        if: ${{ hashFiles('scripts/rollout-server.sh') != '' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/knine79/alley-store:${{ steps.lock.outputs.version }}"

          # 10분. 이미지 빌드는 보통 5분 안쪽이고, 그보다 오래 걸리면 기다릴 것이
          # 아니라 그쪽 로그를 봐야 합니다.
          for attempt in $(seq 1 40); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "$IMAGE 가 올라왔습니다."
              exit 0
            fi
            echo "[$attempt/40] $IMAGE 를 아직 못 찾았습니다. 15초 뒤에 다시 봅니다."
            sleep 15
          done

          echo "::error::$IMAGE 가 10분 안에 올라오지 않았습니다. 제품 레포의 CI 를 보세요." >&2
          exit 1

      - name: 서버 롤아웃
        if: ${{ hashFiles('scripts/rollout-server.sh') != '' }}
        env:
          ALLEY_RELEASE_TAG: ${{ steps.lock.outputs.tag }}
          ALLEY_REGISTRY_USER: ${{ secrets.ALLEY_REGISTRY_USER }}
          ALLEY_REGISTRY_TOKEN: ${{ secrets.ALLEY_REGISTRY_TOKEN }}
        run: ./scripts/rollout-server.sh

      - name: 요약
        run: |
          {
            echo "## 반영했습니다"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| 제품 | \`${{ steps.lock.outputs.tag }}\` |"
            echo "| 워커 | \`${{ steps.worker.outputs.version }}\`" \
                 "${{ steps.worker.outputs.needed == 'true' && '(올림)' || '(이미 최신)' }} |"
            echo
            echo "워커와 스토어 앱은 스스로 갱신합니다. 각 맥에 가지 않아도 됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
