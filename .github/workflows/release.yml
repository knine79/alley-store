name: 릴리스

# 버전 태그를 밀면 GitHub Release 를 만든다 (ADR-0043).
#
# **여기서 서명하지 않는다.** Developer ID 개인키는 조직 것이고, 공개 전제인 이
# 레포의 CI 에 둘 수 없다(ADR-0022). 운영 레포가 이 태그를 고정해 받아, 자기 손으로
# 빌드하고 서명한다.
#
# 그래서 이 워크플로가 내놓는 것은 둘뿐이다.
#
#   - 서버 컨테이너 이미지 (서명이 필요 없다. ci.yml 의 docker 잡이 올린다)
#   - 릴리스 노트와 manifest.json (운영 레포가 무엇을 빌드해야 하는지 읽는다)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 관리 화면이 받아갈 베이스 번들 (ADR-0046).
  #
  # **서명하지 않는다.** 브랜딩 없는 껍데기이고, 조직의 이름·아이콘을 입히는 것도
  # Developer ID 로 서명하는 것도 그쪽 서버와 워커가 한다. 그래서 이것은 ADR-0043 이
  # 금지한 "서명된 산출물" 이 아니다.
  store-app:
    name: 베이스 번들 빌드
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: 의존성 캐시
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-spm-

      # 브랜딩 없는 재료라 붙을 주소를 박지 않는다. 서버가 조립할 때 자기
      # `PUBLIC_BASE_URL` 로 채운다 (ADR-0046). 이 표시가 없으면 스크립트가
      # 거절한다 — 주소 없이 나간 앱은 받은 사람에게 주소를 묻게 되고, 그러면
      # 서명한 조직이 보증하지 않은 서버에도 붙기 때문이다 (ADR-0044).
      - name: 번들 조립
        env:
          ALLEY_STORE_APP_BASE_BUNDLE: '1'
        run: ./scripts/build-store-app.sh

      - uses: actions/upload-artifact@v7
        with:
          name: alley-store-app-unsigned
          path: .build/store-app/alley-store-app-unsigned.zip
          if-no-files-found: error

  release:
    name: GitHub Release 만들기
    runs-on: ubuntu-latest
    needs: store-app
    steps:
      - uses: actions/checkout@v7
        with:
          # 릴리스 노트를 직전 태그부터 쓰려면 이력이 필요하다.
          fetch-depth: 0

      # 태그와 코드의 버전이 어긋나면 만들지 않는다.
      #
      # 운영 레포는 태그로 고정하고, 그 태그가 가리키는 코드가 스스로를 무엇이라
      # 부르는지 신뢰한다. 둘이 다르면 "v0.3.0 을 깔았는데 0.2.9 가 돌고 있다" 가
      # 된다. 조용한 종류의 어긋남이라 여기서 막는다.
      - name: 태그와 코드 버전 대조
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' \
              Sources/AlleyShared/AlleyVersion.swift | head -1)
          WORKER=$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' \
              Sources/AlleyShared/WorkerVersion.swift | head -1)

          if [ "$TAG" != "$CODE" ]; then
            echo "태그 v$TAG 와 AlleyVersion.current ($CODE) 가 다릅니다." >&2
            echo "Sources/AlleyShared/AlleyVersion.swift 를 고치고 다시 태그하세요." >&2
            exit 1
          fi
          echo "product=$TAG" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "제품 $TAG, 워커 $WORKER"

      # 운영 레포가 읽는 파일. "이 릴리스에 무엇이 들었나" 한 장.
      - name: manifest 만들기
        run: |
          set -euo pipefail
          cat > manifest.json <<JSON
          {
            "product": "${{ steps.version.outputs.product }}",
            "worker": "${{ steps.version.outputs.worker }}",
            "serverImage": "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.product }}",
            "commit": "${GITHUB_SHA}",
            "apiVersion": 1
          }
          JSON
          cat manifest.json

      - name: 베이스 번들 받아오기
        uses: actions/download-artifact@v8
        with:
          name: alley-store-app-unsigned

      - name: 릴리스 만들기
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manifest.json
            alley-store-app-unsigned.zip
          generate_release_notes: true
          body: |
            ## 무엇이 들었나

            | | |
            | --- | --- |
            | 제품 | `${{ steps.version.outputs.product }}` |
            | 워커 | `${{ steps.version.outputs.worker }}` |
            | 서버 이미지 | `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.product }}` |
            | 베이스 번들 | `alley-store-app-unsigned.zip` (아래 첨부) |

            ## 스토어 앱을 새로 내려면

            `alley-store-app-unsigned.zip` 을 받아 **관리 > 스토어 앱** 의 베이스 번들에
            올리세요. 조직의 이름과 아이콘을 입혀 다시 싸고 서명 워커에 넘기는 것은
            서버가 합니다 (ADR-0046).

            ## 서명된 산출물은 여기 없습니다

            워커와 CLI 는 **조직이 자기 Developer ID 로 서명해야** 합니다
            (ADR-0043). 운영 레포가 이 태그를 고정해 받아 빌드·서명합니다.
            위 베이스 번들은 브랜딩 없는 미서명 껍데기라 여기서 내놓습니다.

            처음 세우신다면 `templates/ops/` 를 복사해 시작하세요.
