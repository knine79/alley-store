name: CI

on:
  push:
    branches: [main]
    # 버전 태그로도 돌린다. 이 태그가 발행되는 이미지의 버전 태그가 되므로
    # (ADR-0021) 검사를 건너뛰고 이미지만 나가는 경로를 만들지 않는다.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 서버는 Linux 컨테이너에서 돌아가므로 Linux 에서 검증한다.
  build-and-test:
    name: 빌드 및 테스트 (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    services:
      # 테스트가 실제 PostgreSQL 을 쓴다. 마이그레이션과 제약(유니크, 외래키)은
      # 흉내로는 검증되지 않는다.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alley
          POSTGRES_PASSWORD: alley
          POSTGRES_DB: alley_test
        options: >-
          --health-cmd "pg_isready -U alley -d alley_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 잡 컨테이너 안에서는 서비스를 이름으로 부른다.
      TEST_DATABASE_URL: postgres://alley:alley@postgres:5432/alley_test
    steps:
      - uses: actions/checkout@v4

      - name: 의존성 캐시
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: 빌드
        run: swift build --build-tests

      - name: 테스트
        run: swift test --skip-build

  # 워커와 스토어 앱은 macOS 전용이다. 리눅스 잡은 이 둘을 짓지 못한다.
  build-macos:
    name: 워커·스토어 앱 (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 의존성 캐시
        uses: actions/cache@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-spm-

      - name: 워커 빌드
        run: swift build --product alley-worker

      - name: 실행 확인
        run: swift run alley-worker version

      - name: 스토어 앱 번들 조립
        run: ./scripts/build-store-app.sh

      # 워커도 번들로 배포하므로(ADR-0022) 조립까지 여기서 돌린다. 번들을 조립하는
      # 경로는 사람이 릴리스를 만들 때만 지나가서, 깨져 있어도 한동안 아무도 모른다.
      # 실제로 애플 실리콘 링커가 붙이는 ad-hoc 서명 때문에 번들이 검증을 통과하지
      # 못하던 것을 뒤늦게 발견했다.
      #
      # 스토어 앱 다음에 두는 것은 둘 다 release 빌드라 앞 단계가 지어놓은 의존성을
      # 그대로 쓰기 위해서다. 순서를 바꾸면 잡이 느려진다.
      #
      # 서명은 하지 않는다. Developer ID 개인키를 CI 에 두지 않는다(ADR-0002).
      - name: 워커 번들 조립
        run: ./scripts/build-worker-app.sh

      # 이 테스트들은 macOS 에서만 지어진다. 리눅스 잡이 돌리는 swift test 에는
      # 스토어 앱 타깃이 아예 없으므로 여기서 돌리지 않으면 아무도 돌리지 않는다.
      - name: macOS 전용 테스트
        run: swift test --filter 'AlleyStoreTests|AlleyWorkerTests'

  # 조직 고유값이 소스에 섞이지 않았는지 검사한다.
  denylist:
    name: 조직 고유값 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 검사 실행
        env:
          # 금칙어 자체가 유출이므로 레포에 두지 않고 시크릿으로 주입한다.
          DENYLIST_TERMS: ${{ secrets.DENYLIST_TERMS }}
        run: ./scripts/check-denylist.sh

  # 자격증명이 커밋에 섞여 들어갔는지 검사한다.
  secrets:
    name: 자격증명 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 검사 실행
        run: ./scripts/check-secrets.sh

  # 서버 이미지를 지어서 ghcr.io 에 올린다 (ADR-0021).
  # 운영은 소스를 두지 않고 이 이미지를 받아 쓴다.
  docker:
    name: Docker 이미지
    runs-on: ubuntu-latest
    # 테스트를 통과하지 못한 커밋의 이미지가 레지스트리에 남지 않게 한다.
    # 이미지에 들어가는 것은 서버뿐이라 macOS 잡은 기다리지 않는다.
    needs: [build-and-test]
    permissions:
      contents: read
      # 레지스트리 쓰기는 이 잡에만 준다.
      packages: write
    steps:
      # PR 에서는 이미지가 필요할 때만 짓는다.
      #
      # 이 잡 하나가 CI 시간의 대부분이다. 실측에서 전체 16분 중 11분 38초였고,
      # 그중 7분 36초가 `swift build -c release --static-swift-stdlib` 였다.
      # 레이어 캐시가 있어도 `COPY . .` 뒤라서 소스가 한 글자만 바뀌면 다시 돈다.
      #
      # PR 에서는 `push: false` 라 이미지가 나가지도 않는다. 짓는 목적은 Dockerfile
      # 과 의존성이 여전히 유효한지 보는 것인데, 그 둘이 그대로면 새로 알 수 있는
      # 것이 거의 없다. 소스 자체는 바로 앞 `build-and-test` 잡이 컴파일하고
      # 테스트한다.
      #
      # `push` (main·태그)에서는 언제나 짓는다. 그때는 이미지가 실제로 나간다.
      - name: 이미지를 지어야 하나
        id: need
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "PR 이 아닙니다. 짓습니다."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api --paginate \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')

          if printf '%s\n' "$changed" \
              | grep -qE '^(Dockerfile|\.dockerignore|Package\.swift|Package\.resolved|\.github/workflows/ci\.yml)$'; then
            echo "Dockerfile 이나 의존성이 바뀌었습니다. 짓습니다."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile 과 의존성이 그대로입니다. 건너뜁니다."
            echo "  소스는 '빌드 및 테스트 (Linux)' 잡이 컴파일하고 테스트했습니다."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.need.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.need.outputs.build == 'true'

      # 이미지 주소를 레포 경로에서 뽑는다. 포크해도 자기 레포로 나간다.
      # 대문자가 섞인 레포 이름은 액션이 알아서 소문자로 바꾼다.
      - name: 태그 계산
        id: meta
        if: steps.need.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 커밋 SHA 는 언제나, 브랜치 이름은 그 브랜치를 밀 때,
          # 버전 태그(v1.2.3)를 밀면 1.2.3 과 1.2 가 붙는다.
          # `latest` 는 액션 기본값(latest=auto)이 버전 태그에만 붙인다.
          # 브랜치를 민다고 latest 가 움직이지 않는다.
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # PR 에서는 로그인하지 않는다. 포크에서 온 PR 의 토큰에는 쓰기 권한이 없어
      # 밀어봐야 실패한다. 짓는 것까지는 그대로 검증된다.
      - name: 레지스트리 로그인
        if: steps.need.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 및 발행
        if: steps.need.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source 가 여기서 붙는다.
          # 이 라벨이 있어야 GitHub 이 패키지를 레포에 연결한다.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
